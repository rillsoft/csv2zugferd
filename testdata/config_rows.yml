# ZUGFeRD CSV-to-PDF Konfiguration – Modus: rows (eine Zeile pro Position)

csv:
  separator: ";"
  encoding: "UTF-8"
  hasHeader: true
  decimalSeparator: ","
  dateFormat: "dd.MM.yyyy"

zugferd:
  version: "2.3"
  profile: "Extended"
  format: "CII"

mapping:
  invoice:
    invoiceNumber:
      column: "Rechnungsnummer"
    invoiceDate:
      column: "Rechnungsdatum"
    currency:
      value: "EUR"
    orderReferenceId:
      column: "Bestellreferenz"
    name:
      value: "WARENRECHNUNG"
    referenceOrderNo:
      column: "Bestellnummer"
    note:
      column: "Bemerkung"

  buyer:
    name:
      column: "Käufer_Name"
    postalCode:
      column: "Käufer_PLZ"
    city:
      column: "Käufer_Ort"
    street:
      column: "Käufer_Strasse"
    country:
      column: "Käufer_Land"
    taxId:
      column: "Käufer_UStID"
    taxScheme:
      value: "VA"
    contact:
      column: "Käufer_Ansprechpartner"
    electronicAddress:
      column: "Käufer_UStID"
      scheme: "LuxemburgVatNumber"

  seller:
    name:
      column: "Verkäufer_Name"
    postalCode:
      column: "Verkäufer_PLZ"
    city:
      column: "Verkäufer_Ort"
    street:
      column: "Verkäufer_Strasse"
    country:
      column: "Verkäufer_Land"
    taxRegistrations:
      - column: "Verkäufer_Steuernummer"
        scheme: "FC"
      - column: "Verkäufer_UStID"
        scheme: "VA"
    electronicAddress:
      column: "Verkäufer_UStID"
      scheme: "GermanyVatNumber"

  delivery:
    deliveryNoteNumber:
      column: "Lieferscheinnummer"
    deliveryNoteDate:
      column: "Lieferscheindatum"
    actualDeliveryDate:
      column: "Lieferdatum"

  orderReference:
    orderNumber:
      column: "Bestellnummer"
    orderDate:
      column: "Bestelldatum"

  lineItems:
    mode: "rows"
    fields:
      name:
        column: "Artikel_Name"
      description:
        column: "Artikel_Beschreibung"
      netUnitPrice:
        column: "Einzelpreis_Netto"
      billedQuantity:
        column: "Menge"
      unitCode:
        value: "C62"
      taxType:
        value: "VAT"
      taxCategoryCode:
        value: "S"
      taxPercent:
        column: "MwSt_Prozent"
    allowanceCharge:
      enabled: true
      isDiscount:
        value: true
      chargePercentage:
        column: "Rabatt_Prozent"
      reason:
        column: "Rabatt_Grund"

  totals:
    mode: "auto"

  paymentTerms:
    description:
      column: "Zahlungsbedingung"
    dueDate:
      column: "Fälligkeitsdatum"
